[workspace]
resolver = "2"
members = ["crates/spark", "crates/autocore", "crates/jarvis-core", "crates/jarvis-cli", "app/src-tauri"]

[workspace.package]
version = "6.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
cpal = "0.18.2"
hf-hub = { version = "1.0.0", features = ["blocking"] }
hound = "3.5"
rand = "0.8"
rustpotter = { git = "https://github.com/pavel807/RustPotter", version = "4.0.1" }
speakrs = "0.7"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
urlencoding = "2.1"
open = "5.4.2"
# Metal включается только для macOS в crates/jarvis-core/Cargo.toml:
# на Linux и Windows candle считает на CPU, и фича им не нужна.
candle-core = "0.11"
candle-nn = "0.11"
tokenizers = "0.21"
serde_json = "1"
ureq = "3"
regex = "1"
# Встроенная база данных: чистый Rust, без системного sqlite и C-сборки.
redb = "3.1.3"

# Dev-сборка должна отвечать так же быстро, как релизная: LLM, STT и TTS
# считают в зависимостях, и opt-level=0 превращает ответ на несколько секунд
# в минуту. Свои крейты собираем с оптимизацией, но оставляем line-tables
# для отладки; зависимости — на полной скорости без debug info.
[profile.dev]
opt-level = 2
debug = 1
incremental = true
codegen-units = 16

[profile.dev.package."*"]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 16

[profile.dev.package.jarvis-core]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
