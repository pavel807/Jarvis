[package]
name = "jarvis-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
cpal.workspace = true
hf-hub.workspace = true
hound.workspace = true
rand.workspace = true
rustpotter.workspace = true
speakrs.workspace = true
serde.workspace = true
toml.workspace = true
urlencoding.workspace = true
open.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
tokenizers.workspace = true
serde_json.workspace = true
flate2 = "1"
ureq.workspace = true
# Локальное время для планировщика («каждое утро в 8»).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }

# macOS: AppleScript прямо в процессе приложения (NSAppleScript), а не через
# порождение osascript. Так запрос разрешения на автоматизацию приходит от
# самого Джарвиса — «Джарвис хочет управлять Музыкой» — и его можно выдать
# один раз, вместо поиска нужного пункта в Системных настройках.
[target.'cfg(target_os = "macos")'.dependencies]
# CoreML для фильтра говорящего включается только на macOS.
speakrs = { workspace = true, features = ["coreml", "cpu"] }
# Metal-бэкенд candle — только macOS: на Linux и Windows считаем на CPU.
# Записи ниже дополняют features базовых зависимостей (см. [dependencies]).
candle-core = { workspace = true, features = ["metal"] }
candle-nn = { workspace = true, features = ["metal"] }
# objc2 — AppleScript в процессе; block2 — блок-обработчик запроса доступа
# к микрофону (AVFoundation). В objc2 0.6 блоки вынесены в отдельный крейт.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSDictionary",
    "NSAppleScript",
    "NSAppleEventDescriptor",
    "NSThread",
] }
uzu = { git = "https://github.com/trymirai/uzu", rev = "d76d468a1898cacc9c4920accf8f5ff099967107", default-features = false, features = [
    "backend-cpu",
    "backend-metal",
] }
# Прямая зависимость для обёртки uzu_backend: свой multi-thread runtime
# (Engine uzu требует tokio-контекст) и таймауты на сетевые операции.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
speakrs = { workspace = true, features = ["cpu"] }
candle-core = { workspace = true}
candle-nn = { workspace = true}
# AT-SPI2 — Linux-эквивалент macOS Accessibility: чтение дерева элементов UI,
# клики и ввод текста по именам элементов (ui_read/ui_click/ui_type/ui_menu).
atspi = { version = "0.30", default-features = true, features = ["tokio", "zbus"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }


[dev-dependencies]
tempfile = "3"
