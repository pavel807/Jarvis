[package]
name = "jarvis-kokoro"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
# ONNX Runtime (преbuilt-бинарники скачиваются при сборке); CPU-EP достаточен:
# kokoro-ru даёт RTF ~0.1 на CPU.
ort = { version = "2.0.0-rc.11", default-features = true }
# espeak-ng, вкомпилированный в бинарник (без внешних зависимостей и docker)
espeak-rs = "0.1.9"

[dev-dependencies]
hound = { workspace = true }
