[package]
name = "spark"
version = "0.3.0"
edition = "2024"
description = "Spark Lang: скриптовый язык с питон-like синтаксисом, компиляция в Rust. Вендор из github.com/pavel807/Spark"
license = "MIT"

[dependencies]
logos = "0.16"
tempfile = "3"

[lib]
name = "spark"
path = "src/lib.rs"

[[bin]]
name = "spark"
path = "src/bin/spark.rs"
