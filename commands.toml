[global]
reply_success = "resources/audio/ok{}.wav"
reply_error = "resources/audio/reply1.wav"
reply_unknown = "resources/audio/reply1.wav"
reply_ack = "resources/audio/reply1.wav"
fuzzy_min_score = 0.72
ringtone_timer = "resources/audio/ringtone_timer.wav"
ringtone_alarm = "resources/audio/ringtone_alarm.wav"

# --- Поиск: сначала веб-поиск с суммаризацией через LLM, затем открытие Гугла ---

[[commands]]
name = "web_search"
trigger_words = [
    "поищи в интернете",
    "найди в интернете",
    "поиск в интернете",
    "спроси у интернета",
    "что нового про",
    "какие новости про"
]
action_type = "web"
action_value = ""

[[commands]]
name = "search_google_ai"
trigger_words = [
    "найди",
    "поищи",
    "загугли",
    "ищи"
]
action_type = "search"
action_value = "https://www.google.com/search?q={}"

