name: release

# Релиз собирается и уезжает в GitHub Releases автоматически:
#  - при пуше в main — релиз с тегом из версии в Cargo.toml (архивы
#    перезаписываются, установщик тянет самый свежий);
#  - при пуше тега v* — релиз с этим тегом;
#  - вручную — из вкладки Actions.
#
# Установщик берёт бинарники из releases/latest/download/<имя архива>,
# поэтому имена архивов менять нельзя: они зашиты в installer/src/lib.rs.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Два пуша подряд не должны мешать друг другу: публикация идёт по
# очереди, отменять уже начатую сборку нельзя.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Сборка ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      # Зависимости Tauri/Linux: webkit2gtk и GTK — для jarvis-app,
      # libasound2-dev — ALSA для аудио-захвата (cpal → alsa-sys).
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-

      # Фронтенд собирается ДО cargo: tauri::generate_context! встраивает
      # содержимое app/dist при компиляции jarvis-app.
      - name: Build frontend
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build release binaries
        run: cargo build --release --workspace --locked

      - name: Collect artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp target/release/jarvis-cli dist/jarvis-cli-macos-arm64
          cp target/release/jarvis-app dist/jarvis-app-macos-arm64
          tar -czf dist/jarvis-macos-arm64.tar.gz -C dist jarvis-app-macos-arm64 jarvis-cli-macos-arm64

      - name: Collect artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/jarvis-cli dist/jarvis-cli-linux-x64
          cp target/release/jarvis-app dist/jarvis-app-linux-x64
          tar -czf dist/jarvis-linux-x64.tar.gz -C dist jarvis-app-linux-x64 jarvis-cli-linux-x64

      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/jarvis-cli.exe dist/jarvis-cli-windows-x64.exe
          Copy-Item target/release/jarvis-app.exe dist/jarvis-app-windows-x64.exe
          Compress-Archive -Path dist/jarvis-app-windows-x64.exe, dist/jarvis-cli-windows-x64.exe -DestinationPath dist/jarvis-windows-x64.zip

      # Архивы уезжают в общий шаг публикации: релиз создаётся один раз
      # и сразу со всеми платформами.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Публикация в Releases
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Версия из манифеста: секция [workspace.package].
          VERSION=$(awk '
            /^\[workspace\.package\]/ { in_pkg = 1; next }
            /^\[/ { in_pkg = 0 }
            in_pkg && /^version[[:space:]]*=/ {
              gsub(/[" ]/, "", $3); print $3; exit }
          ' Cargo.toml)
          if [ -z "$VERSION" ]; then
            echo "❌ Не нашёл версию в Cargo.toml"; exit 1
          fi
          # Тег: пуш тега — сам тег, пуш в main — версия из манифеста.
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="v$VERSION"
          fi
          echo "🏷 Публикую $TAG (версия $VERSION, коммит $SHA)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Релиз уже есть: перезаписываем архивы свежей сборкой.
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --latest
            echo "♻️ Архивы обновлены в релизе $TAG"
          else
            gh release create "$TAG" \
              --target "$SHA" \
              --title "Джарвис $TAG" \
              --notes "Сборка $SHA (версия $VERSION)." \
              --latest \
              dist/*
            echo "✅ Релиз $TAG создан"
          fi
