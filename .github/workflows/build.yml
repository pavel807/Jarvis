name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-22.04
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Зависимости Tauri/Linux: webkit2gtk и GTK нужны для сборки jarvis-app.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Фронтенд собирается ДО cargo: tauri::generate_context! встраивает
      # содержимое app/dist при компиляции jarvis-app.
      - name: Build frontend
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Test core
        run: cargo test -p jarvis-core --lib --locked

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-cli-${{ runner.os }}
          path: |
            target/debug/jarvis-cli
            target/debug/jarvis-cli.exe
          if-no-files-found: ignore
