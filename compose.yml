# Сборка проекта через compose: один сервис, воспроизводимый контейнер,
# артефакты на хосте в ./dist-out. Нативный путь — ./install.sh.
#
#   docker compose run --rm build          # собрать релиз
#   docker compose run --rm test           # прогнать тесты воркспейса
#
services:
  build:
    build: .
    image: jarvis-build:latest
    volumes:
      - .:/src
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/src/target
    # OUT_DIR — куда сложить артефакты на хосте (по умолчанию dist-out).
    environment:
      - HOME=/root
    command: ["bash", "-lc", "bun install --frozen-lockfile && bun tauri build && mkdir -p /src/${OUT_DIR:-dist-out} && cp -v target/release/jarvis-app /src/${OUT_DIR:-dist-out}/ && cp -rv target/release/bundle/* /src/${OUT_DIR:-dist-out}/ 2>/dev/null || true"]

  test:
    build: .
    image: jarvis-build:latest
    volumes:
      - .:/src
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/src/target
      # Токенизатор для бюджетных тестов живёт в данных пользователя,
      # не в репо: JARVIS_MODELS_DIR направляет поиск в монтирование
      # read-only, чтобы бюджет в контейнере измерялся тем же счётчиком,
      # что и на хосте.
      - ${HOME}/.local/share/Jarvis/models:/host-models:ro
    environment:
      - JARVIS_MODELS_DIR=/host-models
    command: ["bash", "-lc", "cargo test --workspace --quiet && cd app && bun install --frozen-lockfile && bunx svelte-check"]

volumes:
  cargo-registry:
  target-cache:
